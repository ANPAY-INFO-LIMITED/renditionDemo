upstream renditiondemo {
    server 127.0.0.1:8501;
}

server {
    listen 80;
    server_name your-domain.com;  # 替换为你的域名

    # HTTP 自动跳转到 HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name your-domain.com;  # 替换为你的域名

    # SSL 证书配置（请填入你已有的证书路径）
    ssl_certificate /etc/nginx/ssl/your-domain.com/fullchain.pem;  # 替换为你的证书路径
    ssl_certificate_key /etc/nginx/ssl/your-domain.com/privkey.pem;  # 替换为你的私钥路径

    # SSL 安全配置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # 安全头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # 日志配置
    access_log /var/log/nginx/renditiondemo_access.log;
    error_log /var/log/nginx/renditiondemo_error.log;

    # Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml;

    # 上传文件大小限制（适应视频上传需求）
    client_max_body_size 600M;
    client_body_timeout 300s;
    proxy_read_timeout 300s;

    location / {
        proxy_pass http://renditiondemo;
        proxy_http_version 1.1;

        # WebSocket 支持（Streamlit 需要）
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Streamlit 特定配置
        proxy_set_header Accept-Encoding "";

        # 超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
    }

    # 静态文件缓存（如果有的话）
    location /static {
        proxy_pass http://renditiondemo;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
